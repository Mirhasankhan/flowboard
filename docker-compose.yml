services:
  postgres:
    image: postgres:16-alpine
    container_name: flowboard-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flowboard}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-flowboard}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./flowboard-server
      dockerfile: Dockerfile
    container_name: flowboard-api
    restart: unless-stopped
    ports:
      - "${PORT:-4078}:4078"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 4078
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-flowboard}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-flowboard}?schema=public
      JWT_SECRET: ${JWT_SECRET:-secret}
      GEN_SALT: ${GEN_SALT:-10}
      EXPIRES_IN: ${EXPIRES_IN:-45d}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      EMAIL: ${EMAIL:-}
      APP_PASS: ${APP_PASS:-}
      CLOUDNAME: ${CLOUDNAME:-}
      API_KEY: ${API_KEY:-}
      API_SECRET: ${API_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./flowboard-server/src:/app/src
      - ./flowboard-server/prisma:/app/prisma

volumes:
  postgres_data:
